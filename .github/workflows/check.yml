name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Inspect toolchain
        run: moon version --all
      - name: Check and test audit core
        run: |
          moon check --target js --deny-warn
          moon test --target js --deny-warn
          moon test --target wasm-gc --deny-warn
          moon test --target native --deny-warn
      - name: Check generated interface and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
      - name: Test bridge and independent oracle
        run: |
          npm run build
          npm test
          node cli.mjs examples/healthy.json
          node cli.mjs examples/preprocessed.jsonl --jsonl

      - name: Rehearse package with an independent local consumer
        run: npm run check:package

      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.14'
      - name: Install optional pinned preprocessing reference
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install -r integrations/transformers/requirements.txt
      - name: Rebuild collator fixture offline
        if: matrix.os == 'ubuntu-latest'
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m unittest discover -s integrations/transformers -p 'test_*.py' -v

      - name: Install optional CPU model reference
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify model loss and gradient masks offline
        if: matrix.os == 'ubuntu-latest'
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m unittest discover -s integrations/transformers/loss_tests -p 'test_*.py' -v

  teich-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build the shared preparation engine
        run: npm run build
      - name: Install pinned Teich reference and tokenizer adapter
        run: python -m pip install -r integrations/teich/requirements.txt
      - name: Fetch tokenizer and verify public Teich APIs against MoonBit
        run: |
          python integrations/teich/fetch_tokenizer.py
          python integrations/teich/verify.py
          node --test test/preparation.test.mjs
      - name: Verify actual preparation browser workflow
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/verify-preparation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preparation-browser-evidence
          path: artifacts/preparation-browser/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teich-preparation-evidence
          path: artifacts/teich-validation/
