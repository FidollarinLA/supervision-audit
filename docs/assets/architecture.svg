<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc"><title id="title">SupervisionAudit 数据流</title><desc id="desc">JSON 或 JSONL 经 MoonBit 标准化、审计和比较，输出可复现报告，再由浏览器或命令行展示。</desc><rect width="960" height="220" rx="18" fill="#f3f6ee"/><g font-family="sans-serif" text-anchor="middle"><rect x="24" y="50" width="220" height="120" rx="12" fill="#fff" stroke="#d8e0ce"/><text x="134" y="91" font-size="20" fill="#284b36">训练预处理结果</text><text x="134" y="122" font-size="14" fill="#748567">JSON / JSONL</text><text x="134" y="147" font-size="12" fill="#748567">token · labels · 角色 · 来源</text><rect x="292" y="30" width="340" height="160" rx="12" fill="#234b37"/><text x="462" y="76" font-size="23" fill="#fff">MoonBit 核心</text><text x="462" y="111" font-size="15" fill="#d7e8cc">标准化 → 审计 → 差异比较</text><text x="462" y="142" font-size="13" fill="#b6cbae">明确数据契约 · 保留未知证据</text><text x="462" y="168" font-size="12" fill="#b6cbae">可复用类型与确定性结果</text><rect x="680" y="50" width="256" height="120" rx="12" fill="#fff" stroke="#d8e0ce"/><text x="808" y="91" font-size="20" fill="#284b36">可复现报告</text><text x="808" y="122" font-size="14" fill="#748567">本地查看器 / CLI / CI</text><text x="808" y="147" font-size="12" fill="#748567">问题位置 · token 证据 · 修复对比</text></g><g stroke="#8ba67a" fill="#8ba67a" stroke-width="2"><path d="M252 110h29"/><path d="m274 103 8 7-8 7"/><path d="M640 110h29"/><path d="m662 103 8 7-8 7"/></g></svg>
